<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>HASEGAWA WORLD</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #fff;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Yu Gothic", Meiryo, Arial, sans-serif;
    overscroll-behavior: none;
  }
  body {
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  .shell {
    width: min(100%, 1100px);
    margin: 0 auto;
    padding: 14px 0 18px;
  }
  h1 {
    margin: 4px 0 2px;
    text-align: center;
    font-size: clamp(26px, 8vw, 46px);
    letter-spacing: .08em;
  }
  .sub {
    text-align: center;
    margin: 0 0 10px;
    color: #666;
    font-size: clamp(13px, 3.6vw, 17px);
  }
  .game-wrap {
    width: 100%;
    border: 1px solid #d8d8d8;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    touch-action: none;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  button {
    min-height: 50px;
    border: 1px solid #bbb;
    border-radius: 12px;
    background: #f5f5f5;
    color: #222;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(.985); }
  .note {
    text-align: center;
    color: #777;
    font-size: 13px;
    line-height: 1.5;
    margin: 10px 6px 0;
  }
  @media (orientation: landscape) and (max-height: 600px) {
    .shell { padding-top: 4px; }
    h1 { font-size: 28px; margin-top: 0; }
    .sub { margin-bottom: 6px; }
    .controls { margin-top: 7px; }
    button { min-height: 44px; }
    .note { display: none; }
  }
</style>
</head>

<main class="shell">
  <h1>HASEGAWA WORLD</h1>
  <p class="sub">画面をタップしてジャンプ！　横向きがおすすめです。</p>

  <section class="game-wrap" aria-label="HASEGAWA WORLD ゲーム">
    <canvas id="game" width="960" height="320"></canvas>
  </section>

  <div class="controls">
    <button id="jumpBtn" type="button">ジャンプ</button>
    <button id="restartBtn" type="button">もう一度</button>
  </div>

  <p class="note">スマホ：画面または「ジャンプ」をタップ　／　PC：スペース・↑キー</p>
</main>

    const p = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (const o of obstacles) {
      if (collides(p, o)) {
        ended = true;
        running = false;
        highScore = Math.max(highScore, Math.floor(score));
        break;
      }
    }
  }

  function drawAvatar() {
    if (avatar.complete && avatar.naturalWidth) {
      const scale = Math.min(player.w / avatar.naturalWidth, player.h / avatar.naturalHeight);
      const dw = avatar.naturalWidth * scale;
      const dh = avatar.naturalHeight * scale;
      ctx.drawImage(
        avatar,
        player.x + (player.w - dw) / 2,
        player.y + (player.h - dh) / 2,
        dw,
        dh
      );
    } else {
      ctx.fillStyle = "#222";
      ctx.fillRect(player.x, player.y, player.w, player.h);
    }
  }

  function drawCactus(o) {
    ctx.fillStyle = "#3b3b3b";
    ctx.fillRect(o.x + 7, o.y, o.w - 14, o.h);
    ctx.fillRect(o.x, o.y + 16, 9, 13);
    ctx.fillRect(o.x + o.w - 9, o.y + 23, 9, 13);
  }

  function drawBird(o, t) {
    ctx.fillStyle = "#3b3b3b";
    ctx.fillRect(o.x + 11, o.y + 8, 27, 11);
    ctx.fillRect(o.x + 35, o.y + 4, 10, 8);
    const flap = Math.floor(t / 140) % 2 === 0;
    if (flap) {
      ctx.fillRect(o.x + 8, o.y, 18, 7);
      ctx.fillRect(o.x + 8, o.y + 20, 18, 7);
    } else {
      ctx.fillRect(o.x + 2, o.y + 6, 18, 7);
      ctx.fillRect(o.x + 2, o.y + 16, 18, 7);
    }
  }

  function draw(ts = 0) {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = "#666";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 1);
    ctx.lineTo(W, groundY + 1);
    ctx.stroke();

    ctx.strokeStyle = "#c8c8c8";
    ctx.lineWidth = 1;
    const shift = running ? ((performance.now() / 18) % 76) : 0;
    for (let x = 0; x < W + 76; x += 76) {
      ctx.beginPath();
      ctx.moveTo(x - shift, groundY + 12);
      ctx.lineTo(x + 20 - shift, groundY + 12);
      ctx.stroke();
    }

    drawAvatar();

    for (const o of obstacles) {
      if (o.kind === "bird") drawBird(o, ts);
      else drawCactus(o);
    }

    ctx.fillStyle = "#444";
    ctx.font = "20px monospace";
    ctx.textAlign = "right";
    ctx.fillText(
      "HI " + String(highScore).padStart(5, "0") + "  " + String(Math.floor(score)).padStart(5, "0"),
      W - 20,
      31
    );

    if (!running && !ended) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#444";
      ctx.font = "bold 25px sans-serif";
      ctx.fillText("タップしてスタート", W / 2, 115);
      ctx.font = "17px sans-serif";
      ctx.fillStyle = "#777";
      ctx.fillText("障害物をジャンプでよけよう！", W / 2, 145);
    }

    if (ended) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#222";
      ctx.font = "bold 31px monospace";
      ctx.fillText("GAME OVER", W / 2, 108);
      ctx.font = "bold 20px sans-serif";
      ctx.fillText("ゲームオーバー", W / 2, 140);
      ctx.font = "17px sans-serif";
      ctx.fillStyle = "#666";
      ctx.fillText("画面をタップしてもう一度", W / 2, 170);
    }
  }

  function frame(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min(0.032, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw(ts);
    requestAnimationFrame(frame);
  }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    doJump();
  });

  jumpBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    doJump();
  });

  restartBtn.addEventListener("click", () => reset(false));

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      doJump();
    }
    if (e.code === "KeyR") reset(false);
  });

  avatar.onload = () => draw();
  reset(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
