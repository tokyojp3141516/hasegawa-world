const W=c.width,ground=258;
let run=false,over=false,last=0,score=0,hi=0,speed=335,clock=0,next=1050,obs=[];
const p={x:78,y:186,w:62,h:72,vy:0,g:2200,j:-790,on:true};
function sound(){try{const a=baseAudio.cloneNode(true);a.volume=1;a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function reset(start=false){score=0;speed=335;clock=0;next=1050;obs=[];p.y=ground-p.h;p.vy=0;p.on=true;over=false;run=start}
function jump(){if(over){reset(true);p.vy=p.j;p.on=false;sound();return}if(!run)run=true;if(p.on){p.vy=p.j;p.on=false;sound()}}
function spawn(){if(score>180&&Math.random()<.23){const ys=[ground-46,ground-92,ground-126];obs.push({k:"b",x:W+30,y:ys[Math.floor(Math.random()*ys.length)],w:50,h:29})}else{const tall=Math.random()<.5,dbl=Math.random()<.3,w=dbl?46:25,h=tall?62:44;obs.push({k:"c",x:W+30,y:ground-h,w,h})}}
function hit(a,b){const px=8,py=6;return a.x+px<b.x+b.w&&a.x+a.w-px>b.x&&a.y+py<b.y+b.h&&a.y+a.h-py>b.y}
function update(dt){if(!run||over)return;score+=dt*10;speed=Math.min(670,335+score*.42);p.vy+=p.g*dt;p.y+=p.vy*dt;if(p.y>=ground-p.h){p.y=ground-p.h;p.vy=0;p.on=true}clock+=dt*1000;if(clock>=next){clock=0;spawn();next=Math.max(560,760+Math.random()*930-Math.min(score,520)*.28)}for(const o of obs)o.x-=speed*dt;obs=obs.filter(o=>o.x+o.w>-25);for(const o of obs)if(hit(p,o)){over=true;run=false;hi=Math.max(hi,Math.floor(score));break}}
function person(){if(avatar.complete&&avatar.naturalWidth){const s=Math.min(p.w/avatar.naturalWidth,p.h/avatar.naturalHeight),dw=avatar.naturalWidth*s,dh=avatar.naturalHeight*s;x.drawImage(avatar,p.x+(p.w-dw)/2,p.y+(p.h-dh)/2,dw,dh)}}
function cactus(o){x.fillStyle="#333";x.fillRect(o.x+7,o.y,o.w-14,o.h);x.fillRect(o.x,o.y+16,9,13);x.fillRect(o.x+o.w-9,o.y+23,9,13)}
function bird(o,t){x.fillStyle="#333";x.fillRect(o.x+11,o.y+8,27,11);x.fillRect(o.x+35,o.y+4,10,8);const f=Math.floor(t/140)%2===0;if(f){x.fillRect(o.x+8,o.y,18,7);x.fillRect(o.x+8,o.y+20,18,7)}else{x.fillRect(o.x+2,o.y+6,18,7);x.fillRect(o.x+2,o.y+16,18,7)}}
function draw(t=0){x.clearRect(0,0,W,320);x.strokeStyle="#666";x.lineWidth=2;x.beginPath();x.moveTo(0,ground+1);x.lineTo(W,ground+1);x.stroke();x.strokeStyle="#c8c8c8";x.lineWidth=1;const sh=run?(performance.now()/18)%76:0;for(let q=0;q<W+76;q+=76){x.beginPath();x.moveTo(q-sh,ground+12);x.lineTo(q+20-sh,ground+12);x.stroke()}person();for(const o of obs)o.k==="b"?bird(o,t):cactus(o);x.fillStyle="#444";x.font="20px monospace";x.textAlign="right";x.fillText("HI "+String(hi).padStart(5,"0")+"  "+String(Math.floor(score)).padStart(5,"0"),W-20,31);if(!run&&!over){x.textAlign="center";x.fillStyle="#444";x.font="bold 25px sans-serif";x.fillText("タップしてスタート",W/2,115);x.font="17px sans-serif";x.fillStyle="#777";x.fillText("障害物をジャンプでよけよう！",W/2,145)}if(over){x.textAlign="center";x.fillStyle="#222";x.font="bold 31px monospace";x.fillText("GAME OVER",W/2,108);x.font="bold 20px sans-serif";x.fillText("ゲームオーバー",W/2,140);x.font="17px sans-serif";x.fillStyle="#666";x.fillText("画面をタップしてもう一度",W/2,170)}}
function loop(t){if(!last)last=t;const dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(loop)}
c.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
jumpB.addEventListener("pointerdown",e=>{e.preventDefault();jump()});
restartB.addEventListener("click",()=>reset(false));
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}if(e.code==="KeyR")reset(false)});
